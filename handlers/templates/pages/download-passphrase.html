{{ define "content" }}
  <h1 class="h1">Download passphrase</h1>
  <form method="post">
    <div class="mb-4">
      <label class="form-label" for="passphrase">Passphrase</label>
      <input
        id="passphrase"
        class="form-control"
        type="password"
        name="passphrase"
        autofocus
        required
      />
    </div>
    {{ if .IncorrectPassphrase }}
      <div class="alert alert-danger" role="alert">Incorrect passphrase.</div>
    {{ end }}
    <button class="btn btn-primary">Download</button>
  </form>
{{ end }}
