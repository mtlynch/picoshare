{{ define "script-tags" }}
  <script type="module" nonce="{{ .CspNonce }}">
    import { editFile } from "/js/controllers/files.js";
    import { showElement, hideElement } from "/js/lib/bulma.js";
    import {
      convertDateInputValueToRfc3339,
      formatDateInputValue,
      parseRfc3339,
    } from "/js/lib/time.js";

    const editForm = document.getElementById("edit-form");
    const errorContainer = document.getElementById("error");
    const progressSpinner = document.getElementById("progress-spinner");
    const expireCheckbox = document.getElementById("expire-checkbox");
    const expirationDateContainer = document.getElementById(
      "expiration-date-container",
    );
    const expirationDateInput = document.getElementById("expiration-date");

    function readFilename() {
      return document.getElementById("filename").value || null;
    }

    function readNote() {
      return document.getElementById("note").value || null;
    }

    function readExpiration() {
      if (!expireCheckbox.checked) {
        return null;
      }
      return convertDateInputValueToRfc3339(expirationDateInput.value);
    }

    document.getElementById("cancel-btn").addEventListener("click", () => {
      history.back();
    });

    document.getElementById("edit-form").addEventListener("submit", (evt) => {
      evt.preventDefault();
      const id = document
        .getElementById("edit-form")
        .getAttribute("data-entry-id");
      if (!id) {
        return;
      }

      hideElement(errorContainer);
      hideElement(editForm);
      showElement(progressSpinner);

      editFile(id, readFilename(), readExpiration(), readNote())
        .then(() => {
          document.location = "/files";
        })
        .catch((error) => {
          document.getElementById("error-message").innerText = error;
          showElement(errorContainer);
          showElement(editForm);
        })
        .finally(() => {
          hideElement(progressSpinner);
        });
    });

    expireCheckbox.addEventListener("change", () => {
      expirationDateInput.disabled = !expireCheckbox.checked;
      expirationDateContainer.classList.toggle(
        "d-none",
        !expireCheckbox.checked,
      );
    });

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    expirationDateInput.min = formatDateInputValue(tomorrow);

    const expiration = parseRfc3339(expirationDateInput.dataset.expiration);
    if (expiration) {
      expirationDateInput.value = formatDateInputValue(expiration);
    } else {
      const defaultExpiration = new Date();
      defaultExpiration.setDate(defaultExpiration.getDate() + 30);
      expirationDateInput.value = formatDateInputValue(defaultExpiration);
    }
  </script>
{{ end }}

{{ define "content" }}
  <h1 class="h1">Edit File</h1>

  {{ with .Metadata }}
    <form id="edit-form" class="form-panel" data-entry-id="{{ .ID }}">
      <div class="form-panel-body">
        <div class="mb-4">
          <label class="form-label" for="filename">Filename</label>
          <input
            id="filename"
            class="form-control form-control-lg"
            type="text"
            value="{{ .Filename }}"
            required
          />
        </div>

        <fieldset class="mb-4">
          <legend class="form-label">
            <i class="fa-solid fa-clock fa-fw label-icon"></i>Expiration
          </legend>

          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="expire-checkbox"
              {{ if not (isNeverExpire .Expires) }}checked{{ end }}
            />
            <label class="form-check-label" for="expire-checkbox">
              Delete after expiration
            </label>
          </div>
          <div
            id="expiration-date-container"
            class="dependent-field {{ if isNeverExpire .Expires }}
              d-none
            {{ end }}"
          >
            <label class="form-label" for="expiration-date">
              Expiration date
            </label>
            <input
              id="expiration-date"
              class="form-control"
              type="date"
              required
              {{ if not (isNeverExpire .Expires) }}
                data-expiration="{{ formatExpiration .Expires }}"
              {{ end }}
              {{ if isNeverExpire .Expires }}disabled{{ end }}
            />
          </div>
        </fieldset>

        <div>
          <label class="form-label" for="note">
            <i class="fa-solid fa-note-sticky fa-fw label-icon"></i>Note
          </label>
          <input
            id="note"
            class="form-control"
            type="text"
            {{ if .Note.Value }}
              value="{{ .Note }}"
            {{ end }}
          />
          <div class="form-text">Note is only visible to you</div>
        </div>
      </div>

      <div class="form-panel-footer">
        <button class="btn btn-outline-primary" id="cancel-btn" type="button">
          Cancel
        </button>
        <button class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk me-2"></i>
          Save
        </button>
      </div>
    </form>

    <div class="fa-3x d-none" id="progress-spinner">
      <i class="fa-solid fa-spinner fa-spin"></i>
    </div>

    <div id="error" class="d-none my-3">
      <div class="alert alert-danger" role="alert">
        <div id="error-message">Placeholder error.</div>
      </div>
    </div>

    <section class="danger-zone">
      <a
        class="btn btn-outline-danger"
        role="button"
        href="/files/{{ .ID }}/confirm-delete"
      >
        <i class="fa-solid fa-trash me-2"></i>
        Delete
      </a>
    </section>
  {{ end }}
{{ end }}
